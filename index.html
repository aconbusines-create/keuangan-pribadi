    <script>
        // Set tanggal hari ini di kalender
        document.getElementById('calendarPicker').valueAsDate = new Date();

        // Mengaktifkan panel input untuk semua mode (karena sekarang disimpan di browser sendiri)
        document.getElementById('adminPanel').style.display = 'block';

        // Mengambil data dari localStorage saat pertama kali dimuat
        let dataTransaksi = JSON.parse(localStorage.getItem('transaksi_lokal')) || [];
        let periodeAktif = 'week';
        let mainCandleChart, fullCandleChart, pieChart;

        // Fungsi Simpan ke LocalStorage
        function simpanData(tipe) {
            const ket = document.getElementById('ketInput').value;
            const jumlah = parseInt(document.getElementById('jumlahInput').value);
            const tgl = document.getElementById('calendarPicker').value || new Date().toISOString().split('T')[0];
            
            if (!ket || !jumlah) return alert("Isi keterangan & nominal!");

            const dataBaru = {
                id: 'id_' + Date.now(),
                ket,
                jumlah,
                tipe,
                tgl,
                createdAt: Date.now()
            };

            dataTransaksi.push(dataBaru);
            localStorage.setItem('transaksi_lokal', JSON.stringify(dataTransaksi));

            document.getElementById('ketInput').value = "";
            document.getElementById('jumlahInput').value = "";
            
            updateTampilan();
        }

        // Fungsi Hapus Satu Data
        window.hapusData = (id) => {
            if (confirm("Hapus log ini?")) {
                dataTransaksi = dataTransaksi.filter(t => t.id !== id);
                localStorage.setItem('transaksi_lokal', JSON.stringify(dataTransaksi));
                updateTampilan();
            }
        };

        // Fungsi Hapus Semua Data
        document.getElementById('btnHapusSemua').onclick = () => {
            const confirmDel = confirm("PERINGATAN: Kamu akan menghapus SELURUH data transaksi di browser ini. Lanjutkan?");
            if (confirmDel) {
                dataTransaksi = [];
                localStorage.removeItem('transaksi_lokal');
                alert("Penyimpanan lokal berhasil dikosongkan!");
                updateTampilan();
            }
        };

        function getCandleSeries() {
            let saldo = 0;
            const sorted = [...dataTransaksi].sort((a, b) => a.createdAt - b.createdAt);
            let candleData = [];

            sorted.forEach((t, i) => {
                const open = saldo;
                const change = t.tipe === 'masuk' ? t.jumlah : -t.jumlah;
                saldo += change;
                const close = saldo;
                
                const high = Math.max(open, close);
                const low = Math.min(open, close);

                candleData.push({
                    x: (i + 1),
                    y: [open, high, low, close],
                    ket: t.ket,
                    nominal: change
                });
            });
            return [{ data: candleData }];
        }

        function updateTampilan() {
            const pickDate = document.getElementById('calendarPicker').value;
            let hIn = 0, hOut = 0, rIn = 0, rOut = 0, totalIn = 0, totalOut = 0;
            const dList = document.getElementById('dailyHistoryList');
            const fList = document.getElementById('fullHistoryList');
            dList.innerHTML = ""; fList.innerHTML = "";

            // Urutkan berdasarkan tanggal untuk tampilan history
            const sortedData = [...dataTransaksi].sort((a, b) => b.createdAt - a.createdAt);

            dataTransaksi.forEach(t => {
                const del = `<i class="material-icons btn-delete" onclick="hapusData('${t.id}')">delete_outline</i>`;
                const item = `<div class="list-item"><div><b>${t.ket}</b><br><small style="color:#64748b">${t.tgl}</small></div><div style="display:flex;align-items:center"><span class="${t.tipe==='masuk'?'text-green':'text-red'}" style="font-weight:bold">Rp ${t.jumlah.toLocaleString()}</span>${del}</div></div>`;
                
                fList.innerHTML = item + fList.innerHTML;
                if(t.tipe === 'masuk') totalIn += t.jumlah; else totalOut += t.jumlah;
                
                if(t.tgl === pickDate){
                    dList.innerHTML += item;
                    if(t.tipe==='masuk') hIn += t.jumlah; else hOut += t.jumlah;
                }

                const tDate = new Date(t.tgl), pDate = new Date(pickDate);
                let match = false;
                if(periodeAktif === 'year' && tDate.getFullYear() === pDate.getFullYear()) match = true;
                if(periodeAktif === 'month' && tDate.getMonth() === pDate.getMonth() && tDate.getFullYear() === pDate.getFullYear()) match = true;
                
                if(periodeAktif === 'week') {
                    const selisihHari = (pDate - tDate) / 86400000;
                    if(selisihHari >= 0 && selisihHari < 7) match = true;
                }
                
                if(match) { if(t.tipe==='masuk') rIn += t.jumlah; else rOut += t.jumlah; }
            });

            document.getElementById('total-saldo').innerText = "Rp " + (hIn - hOut).toLocaleString();
            document.getElementById('home-in').innerText = "Rp " + hIn.toLocaleString();
            document.getElementById('home-out').innerText = "Rp " + hOut.toLocaleString();
            document.getElementById('rep-in').innerText = "Rp " + rIn.toLocaleString();
            document.getElementById('rep-out').innerText = "Rp " + rOut.toLocaleString();
            document.getElementById('rep-bersih').innerText = "Rp " + (rIn - rOut).toLocaleString();
            
            updateCharts(totalIn, totalOut);
        }

        function getChartOptions(series, isFull = false) {
            return {
                series: series,
                chart: { 
                    type: 'candlestick', 
                    height: isFull ? '90%' : 300, 
                    background: 'transparent',
                    toolbar: { show: true },
                    zoom: { enabled: true, type: 'x', autoScaleYaxis: true }
                },
                plotOptions: {
                    candlestick: {
                        colors: { upward: '#10b981', downward: '#f43f5e' },
                        wick: { useFillColor: true }
                    }
                },
                theme: { mode: 'dark' },
                xaxis: { title: { text: 'Transaksi', style: { color: '#94a3b8', fontSize: '10px' } } },
                yaxis: { labels: { formatter: v => 'Rp ' + v.toLocaleString() } },
                tooltip: {
                    shared: false,
                    custom: function({ seriesIndex, dataPointIndex, w }) {
                        const d = w.globals.initialSeries[seriesIndex].data[dataPointIndex];
                        if(!d) return '';
                        const colorClass = d.nominal >= 0 ? 'text-green' : 'text-red';
                        return `<div style="background: #1e293b; border: 1px solid #334155; padding: 10px; border-radius: 8px;">
                            <div style="font-size: 12px; color: #94a3b8;">#${d.x} ${d.ket}</div>
                            <div class="${colorClass}" style="font-weight: bold;">Rp ${d.nominal.toLocaleString()}</div>
                        </div>`;
                    }
                }
            };
        }

        function updateCharts(tIn, tOut) {
            const series = getCandleSeries();
            const options = getChartOptions(series);

            if (!mainCandleChart) {
                mainCandleChart = new ApexCharts(document.querySelector("#candleChart"), options);
                mainCandleChart.render();
            } else mainCandleChart.updateOptions(options);

            if (fullCandleChart) fullCandleChart.updateOptions(getChartOptions(series, true));

            const pieOpt = {
                series: [tIn, tOut],
                labels: ['Masuk', 'Keluar'],
                colors: ['#10b981', '#f43f5e'],
                chart: { type: 'donut', height: 280 },
                theme: { mode: 'dark' },
                legend: { position: 'bottom' }
            };

            if (!pieChart) {
                pieChart = new ApexCharts(document.querySelector("#pieChart"), pieOpt);
                pieChart.render();
            } else pieChart.updateOptions(pieOpt);
        }

        window.toggleFullscreen = (show) => {
            const overlay = document.getElementById('fullscreen-overlay');
            overlay.style.display = show ? 'block' : 'none';
            if (show) {
                const options = getChartOptions(getCandleSeries(), true);
                if (!fullCandleChart) {
                    fullCandleChart = new ApexCharts(document.querySelector("#candleChartFull"), options);
                    fullCandleChart.render();
                } else fullCandleChart.updateOptions(options);
            }
        };

        document.getElementById('btnMasuk').onclick = () => simpanData('masuk');
        document.getElementById('btnKeluar').onclick = () => simpanData('keluar');
        document.getElementById('calendarPicker').onchange = updateTampilan;
        
        document.querySelectorAll('.nav-item').forEach(nav => {
            nav.onclick = () => {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(nav.dataset.page).classList.add('active');
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active-nav'));
                nav.classList.add('active-nav');
                if (nav.dataset.page === 'report_chart') setTimeout(() => {
                    if(mainCandleChart) mainCandleChart.windowResize();
                    if(pieChart) pieChart.windowResize();
                }, 200);
            };
        });

        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.onclick = () => {
                periodeAktif = tab.id.split('-')[1];
                document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active-tab'));
                tab.classList.add('active-tab');
                updateTampilan();
            };
        });

        // Tampilkan data saat pertama kali aplikasi dibuka
        updateTampilan();
                           </script>
